<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Link preview card</title>
  <!-- Rendered to public/og.png by scripts/render-mockups.mjs (npm run mockups -- og) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #333; }
    #card {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: #e8e8e4; color: #151515; font-family: "Geist Mono", monospace;
    }
    .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 1fr); align-content: start;
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 75%); mask-image: linear-gradient(to bottom, #000, transparent 75%); }
    .tiles i { aspect-ratio: 1; background: #91aaff; }
    .shots { position: absolute; right: -80px; top: 60px; width: 520px; height: 520px; }
    .shot { position: absolute; width: 400px; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
    .shot img { display: block; width: 100%; }
    .s1 { right: 120px; top: 0; transform: rotate(-6deg); }
    .s2 { right: 0; top: 150px; transform: rotate(3deg); }
    .s3 { right: 130px; top: 300px; transform: rotate(-2deg); }
    .text { position: absolute; z-index: 2; left: 64px; bottom: 58px; }
    .status { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(232,232,228,.9); font-size: 17px; }
    .status i { width: 10px; height: 10px; border-radius: 50%; background: #2547f5; }
    h1 { margin: 18px 0 6px; font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; text-transform: uppercase;
      font-size: 140px; line-height: .82; letter-spacing: -0.035em; }
    .role { font-family: "Instrument Serif", serif; text-transform: uppercase; font-size: 40px; letter-spacing: -0.01em; }
    .role span { display: inline-block; border-bottom: 3px solid #2547f5; padding-bottom: 4px; }
    .url { position: absolute; left: 64px; top: 52px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="card">
    <div class="tiles"></div>
    <div class="shots">
      <div class="shot s1"><img src="../../public/work/beacon-showcase-1100.webp" alt="" /></div>
      <div class="shot s2"><img src="../../public/work/pacer-showcase-1100.webp" alt="" /></div>
      <div class="shot s3"><img src="../../public/work/cogni-showcase-1100.webp" alt="" /></div>
    </div>
    <div class="text">
      <span class="status"><i></i>Available for new projects</span>
      <h1>Amanullah</h1>
      <div class="role"><span>Full-stack developer &amp; designer</span></div>
    </div>
  </div>
  <script>
    // same pixel gradient as the site's hero: brighter at the top, random per tile
    const g = document.querySelector(".tiles");
    for (let r = 0; r < 10; r++) for (let c = 0; c < 16; c++) {
      const t = document.createElement("i"); const v = Math.random();
      t.style.opacity = v < 0.2 ? 0 : Math.min(0.85, (0.08 + v * 0.55) * (1 - (r / 9) * 0.9));
      g.append(t);
    }
  </script>
</body>
</html>
