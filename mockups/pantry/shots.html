<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pantry Traker — case study frames</title>
  <!-- Presentation frames for the portfolio case study.
       raw/*.png are captured from index.html by scripts/render-mockups.mjs -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #444; display: grid; gap: 40px; padding: 40px; justify-content: center; }
    .frame { position: relative; overflow: hidden; }
    .bg { background: radial-gradient(800px 600px at 80% 20%, #cfe5cb, transparent 65%), radial-gradient(700px 600px at 10% 90%, #e3eedf, transparent 60%), #f1f1ec; }
    .deep { background: radial-gradient(700px 600px at 70% 20%, #2f8a4a, transparent 65%), linear-gradient(160deg, #1d6b33, #10411f); }
    .blob { position: absolute; border-radius: 50%; background: #a8cfa6; opacity: 0.5; filter: blur(2px); }
    .browser {
      position: absolute; border-radius: 16px; overflow: hidden; background: #fff;
      box-shadow: 0 50px 100px -40px rgba(21, 60, 32, 0.5), 0 0 0 1px rgba(29, 107, 51, 0.12);
    }
    .browser .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f6f6f1; border-bottom: 1px solid #e5e7df; }
    .browser .bar i { width: 11px; height: 11px; border-radius: 50%; background: #dcdfd6; }
    .browser .bar span { margin-left: 18px; padding: 5px 60px; border-radius: 8px; background: #fff; border: 1px solid #e5e7df; font: 500 12px "Segoe UI", system-ui, sans-serif; color: #5f6b63; }
    img { display: block; width: 100%; }
    .phone {
      position: absolute; padding: 12px; border-radius: 54px; background: #1b1f1c;
      box-shadow: 0 60px 120px -40px rgba(21, 60, 32, 0.6), inset 0 0 0 2px #2f3631;
    }
    .phone .screen { overflow: hidden; border-radius: 42px; padding-top: 13%; background: #f1f1ec; }
    .phone::after { content: ""; position: absolute; top: 24px; left: 50%; width: 30%; height: 26px; transform: translateX(-50%); border-radius: 20px; background: #1b1f1c; }
    .shot { position: absolute; filter: drop-shadow(0 50px 60px rgba(10, 40, 20, 0.45)); }
  </style>
</head>
<body>
  <!-- 16:9 — desktop + phone -->
  <section id="showcase" class="frame bg" style="width:1600px;height:900px">
    <div class="browser" style="left:110px;top:90px;width:1150px">
      <div class="bar"><i></i><i></i><i></i><span>pantrytraker.app</span></div>
      <img src="raw/desktop.png" alt="" />
    </div>
    <div class="phone" style="left:1160px;top:150px;width:330px">
      <div class="screen"><img src="raw/mobile.png" alt="" /></div>
    </div>
  </section>

  <!-- 4:5 — the pantry screen with its alerts -->
  <section id="detail-1" class="frame bg" style="width:1080px;height:1350px">
    <div class="blob" style="left:160px;top:240px;width:760px;height:760px"></div>
    <div class="shot" style="left:300px;top:80px;width:480px"><img src="raw/pantry.png" alt="" /></div>
    <div class="shot" style="left:600px;top:260px;width:420px"><img src="raw/low.png" alt="" /></div>
    <div class="shot" style="left:50px;top:1010px;width:420px"><img src="raw/added.png" alt="" /></div>
  </section>

  <!-- 4:5 — expiry tracking and shopping list -->
  <section id="detail-2" class="frame deep" style="width:1080px;height:1350px">
    <div class="shot" style="left:70px;top:150px;width:450px"><img src="raw/expiry.png" alt="" /></div>
    <div class="shot" style="left:560px;top:290px;width:450px"><img src="raw/shopping.png" alt="" /></div>
  </section>
</body>
</html>
